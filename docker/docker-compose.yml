services:
  redis:
    image: redis:7-alpine
    container_name: alerta-redis
    ports:
      - "6379:6379"

  mongo:
    image: mongo:6
    container_name: alerta-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  qdrant:
    image: qdrant/qdrant:latest
    container_name: alerta-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mongo_data:
  qdrant_data:
